name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      PROJECT_PATH: MailForwarder.csproj
      RUNTIME_ID: win-x64
      PUBLISH_DIR: publish
      ZIP_NAME: MailForwarder-win-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from project
        shell: pwsh
        run: |
          [xml]$project = Get-Content $env:PROJECT_PATH
          $version = $project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Version was not found in $env:PROJECT_PATH"
            exit 1
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore $env:PROJECT_PATH

      - name: Publish
        run: >
          dotnet publish $env:PROJECT_PATH
          -c Release
          -r $env:RUNTIME_ID
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o $env:PUBLISH_DIR

      - name: Remove debug symbols from package
        shell: pwsh
        run: |
          Get-ChildItem $env:PUBLISH_DIR -Filter *.pdb -Recurse | Remove-Item -Force

      - name: Create zip archive
        shell: pwsh
        run: |
          if (Test-Path $env:ZIP_NAME) {
            Remove-Item $env:ZIP_NAME -Force
          }
          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath $env:ZIP_NAME

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailforwarder-win-x64
          path: ${{ env.ZIP_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
